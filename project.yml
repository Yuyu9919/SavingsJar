# XcodeGen 工程描述文件
# 作用：不用手工建 .xcodeproj —— 在任何机器上执行 `xcodegen generate` 都能一键生成 Xcode 工程
# 安装：macOS 上执行 `brew install xcodegen`
#
# ⚠️ 上架要求（2026 年 4 月 28 日起生效）
#   上传到 App Store Connect 的包必须用 **Xcode 26 或更高** 编译，且使用 **iOS 26 SDK**。
#   注意：这只限制"用什么编译"，不限制"最低支持哪个系统"——
#   下面的 deploymentTarget 仍是 17.0，iOS 17 的老机器照样能装。

name: SavingsJar

options:
  bundleIdPrefix: com.xiaoyu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  # 主语言设为简体中文：App Store 商品页会优先展示中文
  developmentLanguage: zh-Hans

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal
    ALWAYS_SEARCH_USER_PATHS: "NO"
    # 上架必备：声明本 App 不使用非豁免加密算法
    # 填了它，每次提审就不用再手动回答"出口合规"那一题，能省掉一轮来回
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"

targets:
  SavingsJar:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: SavingsJar

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoyu.savingsjar
        PRODUCT_NAME: SavingsJar
        # 只做 iPhone（用户需要的是 iOS 专用）
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        # 资源目录：App 图标与全局强调色
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

    info:
      path: SavingsJar/Info.plist
      properties:
        CFBundleDisplayName: 攒钱罐
        CFBundleName: SavingsJar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        # 声明支持的语言（影响 App Store 商品页的"语言"栏）
        CFBundleLocalizations:
          - zh-Hans
          - en
        # 必需：否则 iPhone 上会以 1x 兼容模式留黑边
        UILaunchScreen: {}
        # 只支持竖屏（攒钱类工具不需要横屏）
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        # 允许"文件"App 读写导出的 CSV
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

schemes:
  SavingsJar:
    build:
      targets:
        SavingsJar: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
